<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Amortization Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f9;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }
        h2 {
            text-align: center;
        }
        label {
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 5px 0 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #333;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #555;
        }
        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }
        th, td {
            padding: 8px;
            text-align: center;
            border: 1px solid #ddd;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Loan Amortization Calculator</h2>
        <label for="loanAmount">Loan Amount ($):</label>
        <input type="number" id="loanAmount" placeholder="Enter loan amount" required>

        <label for="interestRate">Annual Interest Rate (%):</label>
        <input type="number" id="interestRate" step="0.01" placeholder="Enter interest rate" required>

        <label for="loanTerm">Loan Term (years):</label>
        <input type="number" id="loanTerm" placeholder="Enter loan term" required>

        <button onclick="calculateAmortization()">Calculate</button>

        <h3 id="monthlyPayment"></h3>
        <h3 id="totalInterest"></h3>

        <table id="amortizationTable">
            <thead>
                <tr>
                    <th>Month</th>
                    <th>Payment</th>
                    <th>Principal</th>
                    <th>Interest</th>
                    <th>Balance</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <script>
        function calculateAmortization() {
            let loanAmount = parseFloat(document.getElementById('loanAmount').value);
            let interestRate = parseFloat(document.getElementById('interestRate').value) / 100 / 12;
            let loanTerm = parseInt(document.getElementById('loanTerm').value) * 12;
            
            let monthlyPayment = (loanAmount * interestRate) / (1 - Math.pow(1 + interestRate, -loanTerm));
            let totalInterest = (monthlyPayment * loanTerm) - loanAmount;
            
            document.getElementById('monthlyPayment').innerText = `Monthly Payment: $${monthlyPayment.toFixed(2)}`;
            document.getElementById('totalInterest').innerText = `Total Interest Paid: $${totalInterest.toFixed(2)}`;
            
            let tableBody = document.getElementById('amortizationTable').getElementsByTagName('tbody')[0];
            tableBody.innerHTML = '';
            
            let balance = loanAmount;
            for (let i = 1; i <= loanTerm; i++) {
                let interest = balance * interestRate;
                let principal = monthlyPayment - interest;
                balance -= principal;
                
                let row = tableBody.insertRow();
                row.insertCell(0).innerText = i;
                row.insertCell(1).innerText = `$${monthlyPayment.toFixed(2)}`;
                row.insertCell(2).innerText = `$${principal.toFixed(2)}`;
                row.insertCell(3).innerText = `$${interest.toFixed(2)}`;
                row.insertCell(4).innerText = `$${balance.toFixed(2)}`;
            }
        }
    </script>
</body>
</html>
